# all microservices have an equal service time for mec or cloud resources
microservice_types \
"MS1"=>{:service_time_distribution=>
{:mec=> {distribution: :gaussian, args: {mean: 0.01143607, sd: 0.00301789, seed: seed}},
 :cloud=>{:distribution=>:gaussian, :args=>{:mean=>0.053011, :sd=>0.006149, :seed=>12345}}},
 :resources_requirements_cpu=>50,
 :resources_requirements_memory=>30,
 :node_affinity=>"local",
 #:mdn_file => "examples/davide_student/model_conf/mdn/ms1/model/",
 :rps => 1,
 :wait_for => ["MS2"],
},
"MS2"=>{:service_time_distribution=>{:mec=>{distribution: :gaussian, args: {mean: 0.0289486, sd: 0.004604541, seed: seed}},
:cloud=>{:distribution=>:gaussian, :args=>{:mean=>0.053011, :sd=>0.006149, :seed=>12345}}},
:resources_requirements_cpu=>35,
:resources_requirements_memory=>25,
#:mdn_file => "examples/davide_student/model_conf/mdn/ms2/model/",
:node_affinity=>"local"
}

services \
  'MS1' => {
    serviceName: 'Service1',
    selector: 'MS1'
  },
  'MS2' => {
    serviceName: 'Service2',
    selector: 'MS2'
  }

replica_sets \
  'app' => {
    name: 'rs_1',
    selector: 'MS1',
    replicas: 8,
    dependencies: {
      'dep1' => {
        src: 'MS1',
        dst: 'MS2',
        max_latency: 0.050,    # 50 ms
        min_bandwidth: 10.0    # 10 Mbps
      }
    }
  },
  'app2' => {
    name: 'rs_2',
    selector: 'MS2',
    replicas: 8,
    dependencies: {
      'dep2' => {
        src: 'MS2',
        dst: 'MS1',
        max_latency: 0.050,    # 50 ms
        min_bandwidth: 10.0    # 10 Mbps
      }
    }
  }


horizontal_pod_autoscalers \
     'app' => {
      kind: 'ReplicaSet',
      # this is equivalent to selector/label
      name: 'MS1',
      minReplicas: 1,
      maxReplicas: 8,
      periodSeconds: 15,
      # if processing time is greater than the ...
      targetProcessingPercentage: 1.5
  },
    'app2' => {
      kind: 'ReplicaSet',
      # this is equivalent to selector/label
      name: 'MS2',
      minReplicas: 1,
      maxReplicas: 8,
      periodSeconds: 15,
      targetProcessingPercentage: 1.5
  }

